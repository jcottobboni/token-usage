name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
            tray: true
          - os: windows-latest
            target: windows-x86_64
            tray: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install pyinstaller build
          # on Linux the icon needs the distro's PyGObject, which cannot be bundled
          if [ "${{ matrix.tray }}" = true ]; then python -m pip install "pystray>=0.19.5" "Pillow>=10.1"; fi
      - name: Build executables
        run: python packaging/build.py
      - name: Smoke test
        run: |
          exe=dist/token-usage; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
      - name: Package
        run: |
          mkdir out
          if [ "${{ runner.os }}" = Windows ]; then
            python -m zipfile -c "out/token-usage-${{ matrix.target }}.zip" dist/token-usage.exe dist/token-usage-tray.exe
          else
            cp dist/token-usage "out/token-usage-${{ matrix.target }}"
          fi
          if [ "${{ runner.os }}" = Linux ]; then python -m build --outdir out; fi
      - uses: actions/upload-artifact@v4
        with:
          name: token-usage-${{ matrix.target }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
